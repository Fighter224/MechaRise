<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MechaRise</title><link rel="stylesheet" href="lobby.css?v=6"><link rel="stylesheet" href="lobby-world.css"></head><body>
<main class="modular-lobby"><canvas id="lobby-canvas" aria-label="Layered isometric resistance base with a silver-haired pixel-art pilot"></canvas><div id="station-labels"></div>
<nav class="world-nav" aria-label="Lobby controls"><a href="squad.html">▣ ROBOTS</a><button id="help-button" aria-label="Show controls">?</button><button id="center-camera" aria-label="Center camera on pilot">◎</button></nav>
<div class="world-top-right"><div class="day-controls" role="group" aria-label="Time of day"><button data-time="sun" aria-pressed="true">☀ SUN</button><button data-time="evening" aria-pressed="false">◐ EVENING</button><button data-time="night" aria-pressed="false">☾ NIGHT</button></div><span class="world-scrap">◈ <b id="scrap">0</b></span></div>
<div class="world-bottom"><span class="pilot-badge"><span class="pilot-face"></span><span>PILOT<small>VALHALLA LINK · ONLINE</small></span></span><span id="interaction" role="status">Loading base…</span><div class="zoom-controls"><button id="zoom-out" aria-label="Zoom out">−</button><span id="zoom-label">100%</span><button id="zoom-in" aria-label="Zoom in">+</button></div></div>
<div id="world-loading">ASSEMBLING BASE…</div>
<div class="touch-pad" aria-label="Movement controls"><button data-move="w" aria-label="Move up">▲</button><div><button data-move="a" aria-label="Move left">◀</button><button data-move="s" aria-label="Move down">▼</button><button data-move="d" aria-label="Move right">▶</button></div></div>
</main><dialog id="station-dialog"><button id="close-dialog" class="close" aria-label="Close station">×</button><div id="dialog-content"></div></dialog>
<script src="lobby-map.js"></script><script src="lobby-panels.js"></script><script src="lobby-world.js"></script></body></html>
