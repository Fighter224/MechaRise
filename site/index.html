<header class="nav">
  <a class="logo" href="#/home" aria-label="Home">

    <span>ECLIPSE <em>of the</em> IRON GODS</span>
  </a>
  <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>

    <a href="#/versions" data-page="versions">Versions</a>
