<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MechaRise Assets</title><style>body{margin:0;padding:25px;background:#14222e;color:#dbedf1;font:13px monospace}a{color:#f4d48b}.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}figure{margin:0;background:#213740;border:1px solid #526b75;border-radius:6px;padding:12px}img{width:100%;height:180px;object-fit:contain;background:repeating-conic-gradient(#293e48 0 25%,#344a53 0 50%) 50%/20px 20px}figcaption{padding-top:9px}small{display:block;color:#93b5bf;margin-top:6px}.pilot img{image-rendering:pixelated}h2{margin-top:30px}</style></head><body><a href="index.html">← Base</a> · <a href="assets/lobby/modular/asset-manifest.json">Asset manifest</a><h1>Individual lobby assets</h1><main id="assets"></main><script>fetch('assets/lobby/modular/asset-manifest.json').then(r=>r.json()).then(m=>{for(const folder of ['buildings','props','tiles','pilot']){const section=document.createElement('section');section.innerHTML=`<h2>${folder}</h2><div class="assets"></div>`;for(const a of m.assets.filter(a=>a.file.includes('/'+folder+'/'))){const f=document.createElement('figure');f.className=folder;f.innerHTML=`<a href="${a.file}"><img src="${a.file}" alt="${a.id}"></a><figcaption>${a.id}<small>${a.size.join(' × ')} · transparent PNG</small></figcaption>`;section.lastElementChild.append(f);}document.getElementById('assets').append(section);}});</script></body></html>
